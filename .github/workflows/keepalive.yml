name: Keep-Alive Cron Job

on:
  schedule:
    # Run every 3 days at 09:00 UTC (Supabase pauses after 7 days, HF Spaces idle after 48h)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Ping Hugging Face Space /health (includes DB check)
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          python -c "
          import os
          import httpx
          import sys

          hf_url = os.getenv('HF_SPACE_URL', '').rstrip('/')
          if not hf_url:
              print('::warning::HF_SPACE_URL secret is not set!')
              sys.exit(1)

          print(f'Pinging {hf_url}/health ...')
          try:
              # /health checks DB connectivity and returns 200 if all is well, 503 if DB is paused
              resp = httpx.get(f'{hf_url}/health', timeout=60, follow_redirects=True)
              print(f'Status: {resp.status_code}')
              try:
                  print(f'Response: {resp.json()}')
              except Exception:
                  print(f'Response text: {resp.text[:200]}')

              if resp.status_code == 200:
                  print('SUCCESS: Backend and database are healthy.')
              elif resp.status_code == 503:
                  print('::error::Health check returned 503 - database may still be paused or starting up.')
                  sys.exit(1)
              else:
                  print(f'::warning::Unexpected status {resp.status_code}')
          except Exception as e:
              print(f'::error::Failed to reach HF Space: {e}')
              sys.exit(1)
          "

      - name: Ping Supabase Auth REST Gateway (keeps DNS + API gateway warm)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os
          import httpx

          sr_key = os.getenv('SUPABASE_SERVICE_ROLE_KEY', '')
          db_url = os.getenv('DATABASE_URL', '')

          if not sr_key:
              print('::warning::SUPABASE_SERVICE_ROLE_KEY not set, skipping Auth ping.')
          else:
              try:
                  # Derive project ref from DATABASE_URL username (postgres.PROJECT_REF)
                  ref = None
                  if db_url and '@' in db_url:
                      userinfo = db_url.split('@')[0].split('://')[-1]
                      username = userinfo.split(':')[0]
                      if '.' in username:
                          ref = username.split('.', 1)[1]

                  if not ref:
                      ref = 'sjqiojrqigyufftigvyp'  # fallback hardcoded ref

                  url = f'https://{ref}.supabase.co/rest/v1/'
                  headers = {'apikey': sr_key, 'Authorization': f'Bearer {sr_key}'}
                  resp = httpx.get(url, headers=headers, timeout=15)
                  print(f'Supabase REST Gateway ping: {resp.status_code}')
              except Exception as e:
                  print(f'::warning::Supabase REST ping failed: {e}')
          "
